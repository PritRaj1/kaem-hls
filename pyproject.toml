[project]
name = "kaem-hls"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "brevitas==0.13.2",
    "clu==0.0.12",
    "flax==0.12.9",
    "h5py==3.14.0",
    "hydra-core==1.3.6",
    "jax[cuda13]==0.11.1",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "onnx==1.22.0",
    "onnxoptimizer==0.4.2",
    "onnxruntime==1.29.0",
    "opencv-python-headless==5.0.0.93",
    "optax==0.2.8",
    "orbax-checkpoint==0.12.4",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "qonnx==1.0.0",
    "ruff==0.16.5",
    "scikit-learn==1.9.0",
    "tensorboard==2.21.0",
    "tensorflow==2.21.0",
    "tensorflow-datasets==4.9.10",
    "thermo-ebms",
    "torch==2.12.0",
    "torch-fidelity==0.4.0",
    "torchvision==0.27.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kaem_hls"]

[tool.uv.sources]
thermo-ebms = { path = "../thermo-ebms", editable = true }
